<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090f" />
    <meta name="description" content="SXRON — самостоятельный маркетплейс" />
    <title>SXRON Marketplace</title>
    <style>
      #sxron-forced-update{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,6,12,.92);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
      #sxron-forced-update.open{display:flex}
      .sxron-update-card{width:min(620px,100%);padding:38px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:linear-gradient(145deg,rgba(16,22,34,.98),rgba(10,13,23,.98));box-shadow:0 40px 120px rgba(0,0,0,.55);text-align:center;color:#f8fafc}
      .sxron-update-logo{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(135deg,#20d3c2,#8067f5);display:grid;place-items:center;color:#07100f;font:950 20px system-ui,sans-serif}
      .sxron-update-card h1{margin:0;font:900 30px/1.1 system-ui,sans-serif}
      .sxron-update-card p{margin:12px auto 0;max-width:520px;color:#aab5c7;font:500 14px/1.55 system-ui,sans-serif}
      .sxron-update-versions{display:flex;justify-content:center;gap:12px;margin:24px 0}
      .sxron-version-pill{padding:9px 13px;border-radius:11px;background:rgba(255,255,255,.06);font:800 12px system-ui,sans-serif}
      .sxron-update-main{width:100%;min-height:54px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#20d3c2,#8067f5);font:900 14px system-ui,sans-serif;cursor:pointer}
      .sxron-update-main:disabled{opacity:.55;cursor:wait}
      .sxron-update-percent{margin-top:14px;color:#94a3b8;font:700 12px system-ui,sans-serif}
      .sxron-forced-progress{height:9px;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
      .sxron-forced-progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#20d3c2,#8067f5);transition:width .2s ease}
      .sxron-update-error{display:none;margin-top:14px;color:#ff9b9b;font:600 12px/1.45 system-ui,sans-serif}
      .sxron-update-error.open{display:block}
      html[data-sxron-theme="light"] body{background:#f4f7fb;color:#111827}
      html[data-sxron-theme="light"] .sxron-update-card{color:#111827;background:linear-gradient(145deg,#fff,#f7f9fc);border-color:rgba(15,23,42,.1)}
      html[data-sxron-theme="light"] .sxron-update-card p{color:#5f6b7a}
      html[data-sxron-theme="light"] #sxron-forced-update{background:rgba(15,23,42,.5)}
      @media(max-width:768px){.sxron-update-card{padding:28px 20px}.sxron-update-card h1{font-size:25px}}
    </style>
  </head>
  <body>
    <div id="sxron-forced-update" aria-hidden="true">
      <section class="sxron-update-card" role="dialog" aria-modal="true" aria-labelledby="sxron-update-title">
        <div class="sxron-update-logo">SX</div>
        <h1 id="sxron-update-title">Доступно обязательное обновление</h1>
        <p id="sxron-update-description">Для продолжения работы необходимо обновить SXRON Marketplace. Закрыть это окно без обновления нельзя.</p>
        <div class="sxron-update-versions"><span id="sxron-installed-pill" class="sxron-version-pill">Установлена · 1.1.12</span><span id="sxron-target-pill" class="sxron-version-pill">Новая · —</span></div>
        <button id="sxron-update-main" class="sxron-update-main" type="button">Обновить сейчас</button>
        <div id="sxron-update-percent" class="sxron-update-percent">Готово к обновлению</div>
        <div class="sxron-forced-progress"><i id="sxron-forced-progress-bar"></i></div>
        <div id="sxron-update-error" class="sxron-update-error"></div>
      </section>
    </div>

    <div id="root"></div>
    <script>
      (()=>{
        const forced=document.getElementById('sxron-forced-update');
        const installed=document.getElementById('sxron-installed-pill');
        const target=document.getElementById('sxron-target-pill');
        const main=document.getElementById('sxron-update-main');
        const percent=document.getElementById('sxron-update-percent');
        const forcedBar=document.getElementById('sxron-forced-progress-bar');
        const errorBox=document.getElementById('sxron-update-error');
        let appVersion='1.1.12';
        let targetVersion='';
        let forcedOpen=false;
        let updateDownloadedState=false;

        function openForced(info={}){
          forcedOpen=true;
          forced.classList.add('open');
          forced.setAttribute('aria-hidden','false');
          appVersion=info.currentVersion||appVersion;
          targetVersion=info.targetVersion||targetVersion;
          installed.textContent='Установлена · '+appVersion;
          target.textContent='Новая · '+(targetVersion||'доступна');
          main.disabled=false;
          main.textContent='Обновить сейчас';
          percent.textContent='Готово к обновлению';
          forcedBar.style.width='0%';
          errorBox.classList.remove('open');
          errorBox.textContent='';
        }

        function startDownload(){
          main.disabled=true;
          main.textContent='Загрузка…';
          percent.textContent='Подготавливаем файлы обновления…';
          errorBox.classList.remove('open');
          try{window.open('sxron://start-update')}catch(e){showError(e.message)}
        }

        function install(){
          main.disabled=true;
          main.textContent='Перезапуск…';
          percent.textContent='Устанавливаем новую версию…';
          try{window.open('sxron://install-update')}catch(e){showError(e.message)}
        }

        function showError(message){
          main.disabled=false;
          main.textContent='Повторить обновление';
          percent.textContent='Не удалось завершить обновление';
          errorBox.textContent=message||'Не удалось обновить приложение.';
          errorBox.classList.add('open');
        }

        main.addEventListener('click',()=>{if(updateDownloadedState)install();else startDownload()});

        window.addEventListener('sxron-updater',event=>{
          const d=event.detail||{};
          if(d.event==='app-version'){
            appVersion=d.version||appVersion;
            installed.textContent='Установлена · '+appVersion;
          }else if(d.event==='update-required'){
            targetVersion=d.targetVersion||targetVersion;
            openForced(d);
          }else if(d.event==='download-start'){
            main.disabled=true;
            main.textContent='Загрузка…';
            percent.textContent='Загрузка файлов…';
          }else if(d.event==='download-progress'){
            const p=Math.round(d.percent||0);
            forcedBar.style.width=p+'%';
            percent.textContent='Загрузка: '+p+'%';
            main.disabled=true;
          }else if(d.event==='update-ready'){
            updateDownloadedState=true;
            forcedBar.style.width='100%';
            percent.textContent='Обновление скачано.';
            main.textContent='Установить и перезапустить';
            main.disabled=false;
          }else if(d.event==='update-error'){
            showError(d.message);
          }
        });

        document.addEventListener('keydown',event=>{
          if(forcedOpen&&(event.key==='Escape'||event.key==='F5'||(event.ctrlKey&&event.key.toLowerCase()==='r'))){
            event.preventDefault();
            event.stopPropagation();
          }
        },true);

        window.addEventListener('beforeunload',event=>{
          if(forcedOpen){event.preventDefault();event.returnValue=''}
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
