<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="SXRON — самостоятельный маркетплейс" />
    <title>SXRON Marketplace</title>

    <style>
      /* =====================================================
         SXRON 1.1.0 — Theme + Updates UI
         ===================================================== */
      #sxron-theme-toggle,
      #sxron-updates-toggle {
        position: fixed;
        z-index: 1000;
        height: 40px;
        padding: 0 14px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 12px;
        color: #f8fafc;
        background: rgba(13,17,25,.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 10px 30px rgba(0,0,0,.18);
        cursor: pointer;
        font: 700 13px/1 system-ui, sans-serif;
        transition: .2s ease;
      }
      #sxron-theme-toggle { top: 84px; right: 20px; }
      #sxron-updates-toggle { top: 132px; right: 20px; }
      #sxron-theme-toggle:hover,
      #sxron-updates-toggle:hover { transform: translateY(-1px); border-color: rgba(32,211,194,.4); }

      #sxron-updates-panel {
        position: fixed;
        z-index: 1100;
        top: 84px;
        right: 20px;
        width: min(390px, calc(100vw - 32px));
        max-height: calc(100vh - 110px);
        overflow: auto;
        padding: 22px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 20px;
        color: #f8fafc;
        background: rgba(13,17,25,.96);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 30px 90px rgba(0,0,0,.35);
        display: none;
      }
      #sxron-updates-panel.open { display: block; animation: sxron-updates-in .18s ease; }
      #sxron-updates-panel .sxron-updates-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      #sxron-updates-panel h2 { margin: 0; font: 900 22px/1.1 system-ui,sans-serif; }
      #sxron-updates-panel .sxron-close { width:34px; height:34px; border:1px solid rgba(255,255,255,.1); border-radius:10px; color:inherit; background:rgba(255,255,255,.06); cursor:pointer; font-size:20px; }
      #sxron-updates-panel .sxron-update-version { display:inline-flex; margin-top:16px; padding:6px 9px; border-radius:8px; color:#08110f; background:linear-gradient(135deg,#20d3c2,#8067f5); font:900 11px/1 system-ui,sans-serif; }
      #sxron-updates-panel ul { margin: 15px 0 0; padding-left: 20px; color:#a3afc2; line-height:1.65; font:500 13px/1.65 system-ui,sans-serif; }
      @keyframes sxron-updates-in { from { opacity:0; transform:translateY(-7px); } to { opacity:1; transform:translateY(0); } }

      html[data-sxron-theme="light"] {
        --bg:#f4f7fb; --surface:#fff; --surface-2:#f8fafc; --surface-3:#eef2f7;
        --border:rgba(15,23,42,.10); --border-hover:rgba(20,184,166,.35);
        --text:#111827; --text-secondary:#5f6b7a; --text-muted:#7b8798;
      }
      html[data-sxron-theme="light"] body {
        color:#111827;
        background:radial-gradient(700px 450px at 8% 0%,rgba(32,211,194,.10),transparent 65%),radial-gradient(700px 450px at 95% 4%,rgba(128,103,245,.10),transparent 65%),#f4f7fb;
      }
      html[data-sxron-theme="light"] body::before {
        background:linear-gradient(rgba(15,23,42,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.025) 1px,transparent 1px);
      }
      html[data-sxron-theme="light"] .sxron-topbar { background:rgba(255,255,255,.86); }
      html[data-sxron-theme="light"] .sxron-brand,
      html[data-sxron-theme="light"] .sxron-category-card,
      html[data-sxron-theme="light"] .sxron-topnav button.active,
      html[data-sxron-theme="light"] .sxron-topnav button:hover { color:#111827; }
      html[data-sxron-theme="light"] .sxron-topnav button { color:#64748b; }
      html[data-sxron-theme="light"] .sxron-city-pill,
      html[data-sxron-theme="light"] .sxron-secondary,
      html[data-sxron-theme="light"] .sxron-category-card,
      html[data-sxron-theme="light"] .sxron-searchbar,
      html[data-sxron-theme="light"] .sxron-filter-scroll button,
      html[data-sxron-theme="light"] .sxron-product-card,
      html[data-sxron-theme="light"] .sxron-profile-banner,
      html[data-sxron-theme="light"] .sxron-admin-card,
      html[data-sxron-theme="light"] .sxron-manage-card { background:rgba(255,255,255,.78); }
      html[data-sxron-theme="light"] .sxron-category-card:hover,
      html[data-sxron-theme="light"] .sxron-product-card:hover { background:#fff; }
      html[data-sxron-theme="light"] .sxron-product-image { background:linear-gradient(145deg,#eef3f8,#e3e9f1); }
      html[data-sxron-theme="light"] .sxron-product-image button { background:rgba(255,255,255,.88); color:#111827; }
      html[data-sxron-theme="light"] .sxron-searchbar input,
      html[data-sxron-theme="light"] .sxron-admin-manage input,
      html[data-sxron-theme="light"] .sxron-editor input,
      html[data-sxron-theme="light"] .sxron-editor textarea { color:#111827; }
      html[data-sxron-theme="light"] .sxron-modal { background:#fff; box-shadow:0 30px 100px rgba(15,23,42,.20); }
      html[data-sxron-theme="light"] .sxron-detail-image { background:#eef3f8; }
      html[data-sxron-theme="light"] .sxron-modal-backdrop { background:rgba(15,23,42,.42); }
      html[data-sxron-theme="light"] .sxron-empty h2,
      html[data-sxron-theme="light"] .sxron-detail-content h2,
      html[data-sxron-theme="light"] .sxron-seller-modal h2,
      html[data-sxron-theme="light"] .sxron-section-head h2,
      html[data-sxron-theme="light"] .sxron-page-head h1,
      html[data-sxron-theme="light"] .sxron-product-body h3 { color:#111827; }
      html[data-sxron-theme="light"] .sxron-toast,
      html[data-sxron-theme="light"] #sxron-theme-toggle,
      html[data-sxron-theme="light"] #sxron-updates-toggle,
      html[data-sxron-theme="light"] #sxron-updates-panel {
        color:#111827; background:rgba(255,255,255,.94); border-color:rgba(15,23,42,.10);
      }
      html[data-sxron-theme="light"] #sxron-updates-panel ul { color:#5f6b7a; }

      @media (max-width:768px) {
        #sxron-theme-toggle,#sxron-updates-toggle { right:12px; height:36px; padding:0 11px; font-size:12px; }
        #sxron-theme-toggle { top:70px; }
        #sxron-updates-toggle { top:112px; }
        #sxron-updates-panel { top:58px; right:12px; max-height:calc(100vh - 75px); }
      }
    </style>
  </head>

  <body>
    <button id="sxron-theme-toggle" type="button" aria-label="Переключить тему">🌙 Тёмная</button>
    <button id="sxron-updates-toggle" type="button" aria-label="Открыть обновления">🔔 Обновления</button>

    <aside id="sxron-updates-panel" aria-hidden="true">
      <div class="sxron-updates-head">
        <h2>Обновления SXRON</h2>
        <button class="sxron-close" type="button" aria-label="Закрыть">×</button>
      </div>
      <span class="sxron-update-version">VERSION 1.1.0</span>
      <ul>
        <li>Добавлена полноценная светлая тема.</li>
        <li>Добавлена полноценная тёмная тема.</li>
        <li>Тема сохраняется между запусками приложения.</li>
        <li>Обновлён визуальный слой приложения.</li>
        <li>Добавлен отдельный раздел обновлений.</li>
        <li>1.1.0 — начало новой ветки развития SXRON.</li>
      </ul>
    </aside>

    <div id="root"></div>

    <script>
      (() => {
        const key = "sxron_theme";
        const root = document.documentElement;
        const themeButton = document.getElementById("sxron-theme-toggle");
        const updatesButton = document.getElementById("sxron-updates-toggle");
        const updatesPanel = document.getElementById("sxron-updates-panel");
        const closeButton = updatesPanel.querySelector(".sxron-close");
        const saved = localStorage.getItem(key);
        const initialTheme = saved === "light" || saved === "dark" ? saved : "dark";

        function applyTheme(value) {
          root.dataset.sxronTheme = value;
          localStorage.setItem(key, value);
          themeButton.textContent = value === "dark" ? "☀️ Светлая" : "🌙 Тёмная";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", value === "dark" ? "#07090f" : "#f4f7fb");
        }

        function setUpdates(open) {
          updatesPanel.classList.toggle("open", open);
          updatesPanel.setAttribute("aria-hidden", String(!open));
        }

        applyTheme(initialTheme);
        themeButton.addEventListener("click", () => applyTheme(root.dataset.sxronTheme === "dark" ? "light" : "dark"));
        updatesButton.addEventListener("click", () => setUpdates(!updatesPanel.classList.contains("open")));
        closeButton.addEventListener("click", () => setUpdates(false));
        document.addEventListener("keydown", (event) => { if (event.key === "Escape") setUpdates(false); });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
