name: SXRON Windows Release

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sxron-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: Windows-electron-${{ hashFiles('package.json') }}
          restore-keys: |
            Windows-electron-

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: Windows-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            Windows-electron-builder-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -c "import multipart; print('python-multipart:', multipart.__file__)"
          python -m pip install pyinstaller

      - name: Validate SXRON API source
        shell: pwsh
        run: python -c "import server.main; print('SXRON API source import: OK')"

      - name: Build bundled SXRON API
        shell: pwsh
        run: |
          if (Test-Path backend) { Remove-Item backend -Recurse -Force }
          if (Test-Path build/pyinstaller) { Remove-Item build/pyinstaller -Recurse -Force }
          New-Item -ItemType Directory -Path backend | Out-Null
          python -m PyInstaller --noconfirm --clean --onedir --name sxron-api --distpath backend --workpath build/pyinstaller --specpath build/pyinstaller --collect-all=multipart --hidden-import=multipart --hidden-import=multipart.multipart server/launcher.py
          if (-not (Test-Path 'backend/sxron-api/sxron-api.exe')) { throw 'Bundled SXRON API executable was not created.' }

      - name: Smoke test bundled SXRON API
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'backend\sxron-api\sxron-api.exe'
          $smokeData = Join-Path $PWD 'build\smoke-data'
          $stdout = Join-Path $PWD 'build\smoke-api.stdout.log'
          $stderr = Join-Path $PWD 'build\smoke-api.stderr.log'
          if (Test-Path $smokeData) { Remove-Item $smokeData -Recurse -Force }
          New-Item -ItemType Directory -Path $smokeData | Out-Null
          $oldDataDir = $env:SXRON_DATA_DIR
          $env:SXRON_DATA_DIR = $smokeData
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $healthy = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { break }
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 2
                if ($response.status -eq 'ok') { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Bundled SXRON API failed the Windows startup/health smoke test.'
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if ($null -eq $oldDataDir) { Remove-Item Env:SXRON_DATA_DIR -ErrorAction SilentlyContinue } else { $env:SXRON_DATA_DIR = $oldDataDir }
          }

      - name: Install Node dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SXRON version: $version"

      - name: Build web application
        run: npm run build

      - name: Write build identity
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $build = '${{ github.run_number }}'
          $commit = '${{ github.sha }}'
          $tag = "v$version-build-$build"
          $info = @{ version = $version; build = "$version-build-$build"; run = [int]$build; commit = $commit; releaseTag = $tag } | ConvertTo-Json
          Set-Content -Path 'dist/build-info.json' -Value $info -Encoding UTF8
          Write-Host "Build identity: $tag / $commit"

      - name: Clean Windows release directory
        shell: pwsh
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          New-Item -ItemType Directory -Path release | Out-Null

      - name: Build Windows installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem 'release/SXRON-Marketplace-Setup-*.exe')
          if (-not $setup) { throw 'SXRON Setup.exe was not created.' }
          if ($setup.Count -ne 1) { throw "Expected exactly one Setup.exe, found $($setup.Count)." }
          if ($setup[0].Length -lt 1000000) { throw 'Setup.exe looks invalid or incomplete.' }
          if (-not (Test-Path 'release/latest.yml')) { throw 'latest.yml was not created.' }
          Get-ChildItem release

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem 'release/SXRON-Marketplace-Setup-*.exe')
          $hash = [System.Security.Cryptography.SHA256]::Create()
          try { $bytes = $hash.ComputeHash([System.IO.File]::ReadAllBytes($setup[0].FullName)) } finally { $hash.Dispose() }
          $sha256 = ([Convert]::ToHexString($bytes)).ToLowerInvariant()
          Write-Host "Installer SHA-256: $sha256"

      - name: Create GitHub build release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          name: SXRON Marketplace v${{ steps.version.outputs.version }} build ${{ github.run_number }}
          body: |
            SXRON Marketplace ${{ steps.version.outputs.version }}

            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Этот build создан автоматически из main. Изменения, попавшие в main, получают собственную сборку и установщик.
          generate_release_notes: false
          draft: false
          prerelease: false
          overwrite_files: false
          files: |
            release/SXRON-Marketplace-Setup-*.exe
            release/latest.yml
