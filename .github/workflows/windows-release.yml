name: SXRON Windows Release
# 1.2.11 clean release pipeline
# Release trigger refresh after Windows asset uploader fix

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'server/**'
      - 'electron/**'
      - 'build/**'
      - 'update-manifest.json'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sxron-windows-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: Windows-electron-${{ hashFiles('package.json') }}
          restore-keys: |
            Windows-electron-

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: Windows-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            Windows-electron-builder-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -c "import multipart; import fastapi, pydantic, pydantic_core; import pydantic_core._pydantic_core; print('Python runtime deps: OK', fastapi.__version__, pydantic.__version__, pydantic_core.__version__)"
          python -m pip install pyinstaller

      - name: Validate SXRON API source
        shell: pwsh
        run: |
          python -c "import server.main; import pydantic_core._pydantic_core; print('SXRON API source import: OK')"

      - name: Build bundled SXRON API
        shell: pwsh
        run: |
          if (Test-Path backend) { Remove-Item backend -Recurse -Force }
          if (Test-Path build/pyinstaller) { Remove-Item build/pyinstaller -Recurse -Force }
          New-Item -ItemType Directory -Path backend | Out-Null
          python -m PyInstaller --noconfirm --clean --onedir --name sxron-api --distpath backend --workpath build/pyinstaller --specpath build/pyinstaller --collect-all=multipart --collect-all=pydantic --collect-all=pydantic_core --collect-binaries=pydantic_core --collect-submodules=pydantic_core --hidden-import=multipart --hidden-import=multipart.multipart --hidden-import=pydantic_core._pydantic_core server/launcher.py
          if (-not (Test-Path 'backend/sxron-api/sxron-api.exe')) { throw 'Bundled SXRON API executable was not created.' }
          $pydanticCoreFiles = @(Get-ChildItem 'backend/sxron-api' -Recurse -File | Where-Object { $_.Name -like '_pydantic_core*.pyd' })
          if ($pydanticCoreFiles.Count -eq 0) {
            $sourceCore = python -c "import pathlib, pydantic_core; print(pathlib.Path(pydantic_core.__file__).parent)"
            $sourceBinary = Get-ChildItem $sourceCore -Filter '_pydantic_core*.pyd' -File | Select-Object -First 1
            if (-not $sourceBinary) { throw 'Installed pydantic_core native extension was not found in Python environment.' }
            $targetCore = Join-Path (Join-Path $PWD 'backend\sxron-api') 'pydantic_core'
            New-Item -ItemType Directory -Path $targetCore -Force | Out-Null
            Copy-Item $sourceBinary.FullName (Join-Path $targetCore $sourceBinary.Name) -Force
            Write-Host "Manually copied pydantic_core native extension: $($sourceBinary.Name)"
            $pydanticCoreFiles = @(Get-ChildItem 'backend/sxron-api' -Recurse -File | Where-Object { $_.Name -like '_pydantic_core*.pyd' })
          }
          if ($pydanticCoreFiles.Count -eq 0) { throw 'Bundled pydantic_core native extension was not included.' }
          $bundleImportCheck = python -c "import os,sys; sys.path.insert(0, os.path.abspath('backend\\sxron-api')); import pydantic_core._pydantic_core; print('Bundled native pydantic_core import: OK')"
          Write-Host $bundleImportCheck
          Write-Host "Bundled pydantic_core native extension files: $($pydanticCoreFiles.Count)"
          Write-Host "Bundled API directory created: backend/sxron-api"
          Get-ChildItem 'backend/sxron-api' | Select-Object Name,Length

      - name: Smoke test bundled SXRON API
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'backend\sxron-api\sxron-api.exe'
          $smokeData = Join-Path $PWD 'build\smoke-data'
          $stdout = Join-Path $PWD 'build\smoke-api.stdout.log'
          $stderr = Join-Path $PWD 'build\smoke-api.stderr.log'
          if (Test-Path $smokeData) { Remove-Item $smokeData -Recurse -Force }
          New-Item -ItemType Directory -Path $smokeData | Out-Null
          $oldDataDir = $env:SXRON_DATA_DIR
          $env:SXRON_DATA_DIR = $smokeData
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $healthy = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { Write-Host "SXRON API exited early with code $($proc.ExitCode)."; break }
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 2
                if ($response.status -eq 'ok') { $healthy = $true; Write-Host 'SXRON API health check: OK'; break }
              } catch {}
            }
            if (-not $healthy) {
              Write-Host '----- SXRON API stdout -----'; if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '----- SXRON API stderr -----'; if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Bundled SXRON API failed the Windows startup/health smoke test.'
            }

            $ownerHeaders = @{ "X-SXRON-Client-ID" = "sxron-owner-nikitinka7644" }
            $owner = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8000/auth/owner' -Headers $ownerHeaders -TimeoutSec 5
            if (-not $owner.session_token) { throw 'Owner authentication smoke test did not return a session token.' }
            $adminHeaders = @{ Authorization = "Bearer $($owner.session_token)" }
            $dashboard = Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8000/admin/center/dashboard' -Headers $adminHeaders -TimeoutSec 5
            if (-not $dashboard.stats) { throw 'Admin Center dashboard smoke test failed.' }
            $adminList = Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8000/admin/center/admins' -Headers $adminHeaders -TimeoutSec 5
            if ($null -eq $adminList.admins) { throw 'Admin Center roles smoke test failed.' }
            Write-Host 'Admin Center smoke test: dashboard + roles OK.'
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if ($null -eq $oldDataDir) { Remove-Item Env:SXRON_DATA_DIR -ErrorAction SilentlyContinue } else { $env:SXRON_DATA_DIR = $oldDataDir }
          }

      - name: Install Node dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid SXRON version: '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SXRON version: $version"

      - name: Clean invalid release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view v --repo WhiteBelStudio/SxronApp | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            Write-Host 'Removing malformed GitHub release tag: v'
            gh release delete v --yes --cleanup-tag --repo WhiteBelStudio/SxronApp
            if ($LASTEXITCODE -ne 0) { throw 'Failed to remove malformed release tag v' }
          } else {
            Write-Host 'Malformed release tag v not present.'
          }
          $global:LASTEXITCODE = 0

      - name: Build launcher
        shell: pwsh
        run: |
          if (Test-Path 'build/launcher/SXRON Launcher.exe') { Remove-Item 'build/launcher/SXRON Launcher.exe' -Force }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "C# compiler not found: $csc" }
          & $csc /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll /out:'build\launcher\SXRON Launcher.exe' 'build\launcher\SXRONLauncher.cs'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to compile SXRON Launcher.exe' }
          if (-not (Test-Path 'build\launcher\SXRON Launcher.exe')) { throw 'Launcher EXE was not created.' }
          & 'build\launcher\SXRON Launcher.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'SXRON Launcher smoke test failed.' }

      - name: Build web application
        run: npm run build

      - name: Write version identity
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $commit = '${{ github.sha }}'
          $tag = "v$version"
          $info = @{ version = $version; build = $version; commit = $commit; releaseTag = $tag } | ConvertTo-Json
          Set-Content -Path 'dist/build-info.json' -Value $info -Encoding UTF8
          Write-Host "Version identity: $tag / $commit"
          Set-Content -Path 'build/current-version.txt' -Value $version -Encoding ASCII

      - name: Verify current version consistency
        shell: pwsh
        run: |
          $expected = '${{ steps.version.outputs.version }}'
          if ($expected -ne '1.4.0') { throw "This production branch must build SXRON 1.4.0, got $expected" }
          $files = @(
            'package.json',
            'src/main.tsx',
            'server/release_version.py',
            'src/components/ForcedUpdater.tsx',
            'build/launcher/SXRONLauncher.cs',
            'START-SXRON.bat',
            'update-manifest.json'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Version consistency file missing: $file" }
            $text = Get-Content $file -Raw
            if ($text -match '1\.3\.[0-5]') { throw "Stale 1.3.x version found in $file" }
          }
          Write-Host 'Production version consistency: 1.4.0'
      - name: Clean Windows release directory
        shell: pwsh
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          New-Item -ItemType Directory -Path release | Out-Null
          Write-Host 'Clean release directory prepared.'

      - name: Build Windows installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify launcher packaging
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/current-version.txt')) { throw 'current-version.txt missing.' }
          if (-not (Test-Path 'build/launcher/SXRON Launcher.exe')) { throw 'Launcher EXE missing.' }
          if (-not (Test-Path 'release/win-unpacked/resources/launcher/SXRON Launcher.exe')) { throw 'Packaged launcher resource missing.' }
          $installedVersion = (Get-Content 'build/current-version.txt' -Raw).Trim()
          if ($installedVersion -ne '${{ steps.version.outputs.version }}') { throw "Version identity mismatch: $installedVersion" }
          Write-Host "Launcher packaging verified for version $installedVersion."

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem 'release/SXRON-Marketplace-Setup-*.exe')
          if (-not $setup) { throw 'SXRON Setup.exe was not created.' }
          if ($setup.Count -ne 1) { throw "Expected exactly one Setup.exe, found $($setup.Count)." }
          if ($setup[0].Length -lt 1000000) { throw 'Setup.exe looks invalid or incomplete.' }
          if (-not (Test-Path 'release/latest.yml')) { throw 'latest.yml was not created.' }
          Write-Host "Verified Setup: $($setup[0].FullName) ($($setup[0].Length) bytes)"
          Get-ChildItem release

      - name: Smoke test packaged SXRON API
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release\win-unpacked\resources\backend\sxron-api\sxron-api.exe'
          if (-not (Test-Path $exe)) { throw "Packaged SXRON API executable not found: $exe" }
          $smokeData = Join-Path $PWD 'build\packaged-api-smoke-data'
          $stdout = Join-Path $PWD 'build\packaged-api.stdout.log'
          $stderr = Join-Path $PWD 'build\packaged-api.stderr.log'
          if (Test-Path $smokeData) { Remove-Item $smokeData -Recurse -Force }
          New-Item -ItemType Directory -Path $smokeData | Out-Null
          $oldDataDir = $env:SXRON_DATA_DIR
          $env:SXRON_DATA_DIR = $smokeData
          $proc = $null
          $healthy = $false
          try {
            $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { break }
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 2
                if ($response.status -eq 'ok') { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) {
              Write-Host '----- packaged API stdout -----'; if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '----- packaged API stderr -----'; if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Packaged SXRON API failed to start after electron-builder copied resources.'
            }
            Write-Host 'Packaged SXRON API smoke: OK'
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if ($null -eq $oldDataDir) { Remove-Item Env:SXRON_DATA_DIR -ErrorAction SilentlyContinue } else { $env:SXRON_DATA_DIR = $oldDataDir }
          }

      - name: Smoke test packaged Electron app
        shell: pwsh
        run: |
          $appExe = Join-Path $PWD 'release\win-unpacked\SXRON Marketplace.exe'
          if (-not (Test-Path $appExe)) { throw "Packaged Electron executable not found: $appExe" }

          $smokeData = Join-Path $PWD 'build\smoke-electron-data'
          if (Test-Path $smokeData) { Remove-Item $smokeData -Recurse -Force }
          New-Item -ItemType Directory -Path $smokeData | Out-Null
          $oldDataDir = $env:SXRON_DATA_DIR
          $env:SXRON_DATA_DIR = $smokeData

          try {
            Write-Host "Launching packaged Electron: $appExe"
            $env:SXRON_SMOKE_TEST = '1'
            $env:SXRON_FULL_STARTUP_SMOKE = '1'
            $proc = Start-Process -FilePath $appExe -ArgumentList '--disable-gpu','--no-sandbox' -WorkingDirectory (Join-Path $PWD 'release\win-unpacked') -PassThru

            Start-Sleep -Seconds 12

            if ($proc.HasExited) {
              Write-Host "Packaged Electron startup smoke exited with code: $($proc.ExitCode)"
              if ($proc.ExitCode -ne 0) {
                throw "Packaged SXRON Electron startup failed with exit code $($proc.ExitCode)."
              }
            } else {
              Write-Host 'Packaged Electron stayed alive for the full startup smoke window: OK.'
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          } finally {
            if ($null -eq $oldDataDir) { Remove-Item Env:SXRON_DATA_DIR -ErrorAction SilentlyContinue } else { $env:SXRON_DATA_DIR = $oldDataDir }
          }

          Write-Host 'Packaged Electron bootstrap smoke test: OK.'

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem 'release/SXRON-Marketplace-Setup-*.exe')
          $latest = Get-Content 'release/latest.yml' -Raw
          $fileMatch = [regex]::Match($latest, '(?m)^\s*-\s+url:\s*(.+)$')
          $shaMatch = [regex]::Match($latest, '(?m)^\s+sha512:\s*(.+)$')
          if (-not $fileMatch.Success) { throw 'latest.yml does not contain installer url.' }
          if (-not $shaMatch.Success) { throw 'latest.yml does not contain sha512.' }
          $manifestFile = $fileMatch.Groups[1].Value.Trim()
          $expected = $shaMatch.Groups[1].Value.Trim()
          if ($manifestFile -ne $setup[0].Name) { throw "latest.yml points to '$manifestFile', actual installer is '$($setup[0].Name)'." }
          $sha = [System.Security.Cryptography.SHA512]::Create()
          try { $hashBytes = $sha.ComputeHash([System.IO.File]::ReadAllBytes($setup[0].FullName)) } finally { $sha.Dispose() }
          $actual = [Convert]::ToBase64String($hashBytes)
          if ($actual -ne $expected) { throw "SHA-512 mismatch: latest.yml=$expected actual=$actual" }
          Write-Host "SHA-512 verified: $actual"

      - name: Publish Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $exe = Get-ChildItem "release/SXRON-Marketplace-Setup-$version-x64.exe"
          $latest = Get-Item 'release/latest.yml'
          if (-not $exe) { throw "Installer not found: $tag" }
          if (-not $latest) { throw 'latest.yml missing' }

          gh release view $tag --repo WhiteBelStudio/SxronApp | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if (-not $releaseExists) {
            Write-Host "Release $tag does not exist yet. Creating it now..."
            gh release create $tag --title "SXRON Marketplace $version" --notes "SXRON Marketplace $version — desktop redesign and release update." --repo WhiteBelStudio/SxronApp
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release: $tag" }
          }

          Write-Host "Uploading $($exe.Name) with GitHub CLI..."
          gh release upload $tag $exe.FullName --clobber --repo WhiteBelStudio/SxronApp
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($exe.Name)" }

          Write-Host 'Uploading latest.yml with GitHub CLI...'
          gh release upload $tag $latest.FullName --clobber --repo WhiteBelStudio/SxronApp
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload latest.yml' }

      - name: Verify published Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          $global:LASTEXITCODE = 0
          $expected = "SXRON-Marketplace-Setup-$version-x64.exe"
          if (!($assets.assets.name -contains $expected)) { throw "Published EXE missing: $expected" }
          if (!($assets.assets.name -contains 'latest.yml')) { throw 'Published latest.yml missing' }
          Write-Host 'Windows release assets verified successfully.'
