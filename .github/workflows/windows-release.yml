name: SXRON Windows Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'electron/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: Windows-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Windows-electron-

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
            path: |
              ~/.cache/electron-builder
              ~/AppData/Local/electron-builder/Cache
            key: Windows-electron-builder-${{ hashFiles('package-lock.json') }}
            restore-keys: |
              Windows-electron-builder-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SXRON version: $version"

      - name: Build web application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $executables = Get-ChildItem 'release/*.exe' | Where-Object { $_.Name -notmatch '__uninstaller\.exe$' }
          if (-not $executables) {
            throw 'No Windows .exe artifacts were created.'
          }

          $valid = $executables | Where-Object { $_.Length -ge 1000000 }
          if (-not $valid) {
            throw 'Windows .exe artifacts look invalid or incomplete.'
          }

          Write-Host 'Windows artifacts:'
          $valid | ForEach-Object {
            Write-Host "- $($_.FullName) ($($_.Length) bytes)"
          }

          Get-ChildItem release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SXRON Marketplace v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
