name: SXRON Windows Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'server/**'
      - 'electron/**'
      - 'build/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: Windows-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Windows-electron-

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
            path: |
              ~/.cache/electron-builder
              ~/AppData/Local/electron-builder/Cache
            key: Windows-electron-builder-${{ hashFiles('package-lock.json') }}
            restore-keys: |
              Windows-electron-builder-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install pyinstaller

      - name: Build bundled SXRON API
        shell: pwsh
        run: |
          if (Test-Path backend) { Remove-Item backend -Recurse -Force }
          New-Item -ItemType Directory -Path backend | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --name sxron-api --distpath backend --workpath build/pyinstaller --specpath build/pyinstaller server/launcher.py
          if (-not (Test-Path 'backend/sxron-api.exe')) {
            throw 'Bundled SXRON API executable was not created.'
          }
          Write-Host "Bundled API: $((Get-Item 'backend/sxron-api.exe').Length) bytes"

      - name: Install Node dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SXRON version: $version"

      - name: Build web application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'release/SXRON-Marketplace-Setup-*.exe'
          if (-not $setup) {
            throw 'SXRON Setup.exe was not created.'
          }

          if ($setup.Count -ne 1) {
            throw "Expected exactly one Setup.exe, found $($setup.Count)."
          }

          if ($setup.Length -lt 1000000) {
            throw 'Setup.exe looks invalid or incomplete.'
          }

          Write-Host "Verified Setup: $($setup.FullName) ($($setup.Length) bytes)"
          Get-ChildItem release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SXRON Marketplace v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/SXRON-Marketplace-Setup-*.exe
            release/latest.yml
