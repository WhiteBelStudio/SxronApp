name: SXRON Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install pyinstaller
          python -c "import multipart; print('python-multipart OK:', multipart.__file__)"

      - name: Build bundled SXRON API
        shell: pwsh
        run: |
          if (Test-Path backend) { Remove-Item backend -Recurse -Force }
          New-Item -ItemType Directory -Path backend | Out-Null
          # Explicitly collect python-multipart so FastAPI Form/File routes work inside PyInstaller.
          python -m PyInstaller --noconfirm --clean --onedir --name sxron-api --distpath backend --workpath build/pyinstaller --specpath build/pyinstaller --collect-all=multipart --hidden-import=multipart --hidden-import=multipart.multipart server/launcher.py
          if (-not (Test-Path 'backend/sxron-api/sxron-api.exe')) {
            throw 'Bundled SXRON API executable was not created.'
          }
          Write-Host 'SXRON API bundle created successfully.'
          Get-ChildItem 'backend/sxron-api' | Select-Object Name,Length

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Verify application version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Write-Host "SXRON Marketplace version: $version"
          if ($version -ne '1.0.13') { throw "Expected version 1.0.13, got $version" }

      - name: Build SXRON Windows installer
        run: npm run app:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'release/SXRON-Marketplace-Setup-*.exe')
          if ($files.Count -ne 1) { throw "Expected exactly one SXRON installer, found $($files.Count)." }
          if ($files[0].Length -lt 1000000) { throw 'Installer is suspiciously small.' }
          Write-Host "Verified installer: $($files[0].FullName) ($($files[0].Length) bytes)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SXRON-Windows-1.0.13
          path: release/SXRON-Marketplace-Setup-*.exe
          if-no-files-found: error
