name: SXRON iOS 1.0.1

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v1.0.1'
    runs-on: macos-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || 'main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Install Capacitor iOS
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Build iOS archive without signing
        working-directory: ios
        run: |
          xcodebuild \
            -workspace App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/SXRON.xcarchive" \
            archive \
            MARKETING_VERSION=1.0.1 \
            CURRENT_PROJECT_VERSION=2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify iOS archive
        run: test -d ios/build/SXRON.xcarchive

      - name: Package unsigned iOS archive
        run: |
          cd ios/build
          zip -r ../../SXRON-Marketplace-1.0.1-iOS-unsigned.xcarchive.zip SXRON.xcarchive

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxron-ios-1.0.1-unsigned
          path: SXRON-Marketplace-1.0.1-iOS-unsigned.xcarchive.zip

      - name: Upload iOS build to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: SXRON-Marketplace-1.0.1-iOS-unsigned.xcarchive.zip
