name: SXRON Windows Release Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sxron-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install pyinstaller

      - name: Fix launcher in build workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $s = Get-Content server/launcher.py -Raw
          $s = $s -replace 'from server.public_api import app, db, init_db', "from server.public_api import app`n    from server.main import db, init_db"
          $s = $s -replace 'from public_api import app, db, init_db', "from public_api import app`n    from main import db, init_db"
          Set-Content build/launcher.py $s -Encoding UTF8
          python -m py_compile build/launcher.py

      - name: Build API
        shell: pwsh
        run: |
          Remove-Item backend -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path backend | Out-Null
          python -m PyInstaller --noconfirm --clean --onedir --name sxron-api --distpath backend --workpath build/pyinstaller --specpath build/pyinstaller --collect-all=multipart --hidden-import=multipart --hidden-import=multipart.multipart build/launcher.py
          if (!(Test-Path backend/sxron-api/sxron-api.exe)) { throw 'API executable missing' }

      - name: API smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/smoke-data | Out-Null
          $env:SXRON_DATA_DIR = (Resolve-Path build/smoke-data).Path
          $p = Start-Process backend/sxron-api/sxron-api.exe -WorkingDirectory (Resolve-Path backend/sxron-api).Path -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep 1
              if ($p.HasExited) { break }
              try {
                $r = Invoke-RestMethod http://127.0.0.1:8000/health -TimeoutSec 2
                if ($r.status -eq 'ok') { $ok = $true; break }
              } catch {}
            }
          } finally {
            if (!$p.HasExited) { Stop-Process $p.Id -Force }
          }
          if (!$ok) { throw 'API smoke test failed' }

      - name: Install Node dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          Write-Host "Version $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build web
        run: npm run build

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $expected = "SXRON-Marketplace-Setup-$version-x64.exe"
          $files = @(Get-ChildItem release/SXRON-Marketplace-Setup-*.exe)
          if ($files.Count -ne 1) { throw 'Installer missing or multiple installers found' }
          if ($files[0].Name -ne $expected) { throw "Unexpected installer name: $($files[0].Name), expected $expected" }
          if ($files[0].Length -lt 1000000) { throw 'Installer invalid' }
          if (!(Test-Path release/latest.yml)) { throw 'latest.yml missing' }
          $latest = Get-Content release/latest.yml -Raw
          if ($latest -notmatch [regex]::Escape("version: $version")) { throw 'latest.yml version mismatch' }

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $exe = "release/SXRON-Marketplace-Setup-$version-x64.exe"
          if (!(Test-Path $exe)) { throw "Installer not found: $exe" }
          if (!(Test-Path release/latest.yml)) { throw 'latest.yml missing' }
          gh release upload $tag $exe release/latest.yml --clobber

      - name: Verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($assets.assets | ForEach-Object { $_.name })
          $expected = @(
            "SXRON-Marketplace-Setup-$version-x64.exe",
            'latest.yml'
          )
          foreach ($name in $expected) {
            if ($names -notcontains $name) { throw "Published asset missing: $name" }
          }
          Write-Host "Published assets: $($names -join ', ')"
