name: SXRON Windows Release Final

# Release pipeline: build and publish the Windows installer for the current release.
# Rebuild trigger: keep Windows 1.2.5 release pipeline runnable from current main.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'electron/**'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-release-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sxron-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/sxron-api/requirements.txt
          pip install pyinstaller

      - name: Fix launcher in build workspace
        shell: pwsh
        run: |
          $launcher = 'backend/sxron-api/launcher.py'
          if (Test-Path $launcher) {
            $text = Get-Content $launcher -Raw
            $text = $text -replace 'uvicorn\.run\([^\)]*\)', 'uvicorn.run(app, host="127.0.0.1", port=8000)'
            Set-Content -Path $launcher -Value $text -Encoding UTF8
          }

      - name: Build API
        shell: pwsh
        run: |
          cd backend/sxron-api
          pyinstaller --clean --onefile --name sxron-api launcher.py
          if (!(Test-Path dist/sxron-api.exe)) { throw 'API executable was not created' }

      - name: API smoke test
        shell: pwsh
        run: |
          $api = 'backend/sxron-api/dist/sxron-api.exe'
          $p = Start-Process -FilePath $api -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/health' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (!$ok) { throw 'API health check failed' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Node dependencies
        run: npm ci

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.2.5') { throw "Expected version 1.2.5, got $($pkg.version)" }
          "version=$($pkg.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build web
        run: npm run build

      - name: Prepare API for Electron
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/sxron-api/dist-final | Out-Null
          Copy-Item backend/sxron-api/dist/sxron-api.exe backend/sxron-api/dist-final/sxron-api.exe -Force
          if (!(Test-Path backend/sxron-api/dist-final/sxron-api.exe)) { throw 'Final API executable missing' }

      - name: Build installer
        shell: pwsh
        run: |
          npm exec electron-builder -- --win nsis --publish never
          $exe = "release/SXRON-Marketplace-Setup-${{ steps.version.outputs.version }}-x64.exe"
          if (!(Test-Path $exe)) {
            $found = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
            if (!$found) { throw 'Windows installer was not created' }
            Copy-Item $found.FullName $exe -Force
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = "release/SXRON-Marketplace-Setup-${{ steps.version.outputs.version }}-x64.exe"
          if (!(Test-Path $exe)) { throw "Installer not found: $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw "Installer is unexpectedly small: $size bytes" }
          Write-Host "Installer ready: $exe ($size bytes)"

      - name: Prepare streaming release uploader
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const https = require('https');
          const { URL } = require('url');

          const token = process.env.GH_TOKEN;
          const owner = 'WhiteBelStudio';
          const repo = 'SxronApp';
          const releaseId = process.env.RELEASE_ID;

          function request(method, url, headers = {}, input = null) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname,
                port: 443,
                path: u.pathname + u.search,
                method,
                headers: {
                  'User-Agent': 'SXRON-release-uploader',
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                  ...headers
                },
                timeout: 0
              }, res => {
                let body = '';
                res.setEncoding('utf8');
                res.on('data', chunk => body += chunk);
                res.on('end', () => resolve({ status: res.statusCode || 0, body }));
              });
              req.on('error', reject);
              req.setTimeout(0);
              if (input) {
                input.on('error', reject);
                input.pipe(req);
              } else {
                req.end();
              }
            });
          }

          async function upload(file) {
            const stat = fs.statSync(file.path);
            const url = `https://uploads.github.com/repos/${owner}/${repo}/releases/${releaseId}/assets?name=${encodeURIComponent(file.name)}`;
            for (let attempt = 1; attempt <= 5; attempt++) {
              console.log(`Streaming upload ${file.name}, attempt ${attempt}/5 (${stat.size} bytes)`);
              try {
                const result = await request('POST', url, {
                  'Content-Type': file.contentType,
                  'Content-Length': stat.size
                }, fs.createReadStream(file.path));
                console.log(`GitHub upload response: HTTP ${result.status}`);
                if (result.status >= 200 && result.status < 300) return;
                console.log(result.body.slice(0, 2000));
                if (result.status >= 400 && result.status < 500 && result.status !== 429) {
                  throw new Error(`GitHub rejected upload with HTTP ${result.status}`);
                }
              } catch (error) {
                console.log(`Upload attempt failed: ${error.message}`);
              }
              if (attempt < 5) await new Promise(r => setTimeout(r, attempt * 15000));
            }
            throw new Error(`Failed to upload ${file.name} after 5 attempts`);
          }

          async function main() {
            if (!token || !releaseId) throw new Error('GH_TOKEN or RELEASE_ID is missing');
            await upload({ path: process.env.EXE_PATH, name: process.env.EXE_NAME, contentType: 'application/octet-stream' });
            await upload({ path: process.env.LATEST_PATH, name: 'latest.yml', contentType: 'text/yaml' });
          }

          main().catch(error => { console.error(error); process.exit(1); });
          '@ | Set-Content -Path build/release-uploader.cjs -Encoding UTF8

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $exe = "release/SXRON-Marketplace-Setup-$version-x64.exe"
          $latest = 'release/latest.yml'
          if (!(Test-Path $exe)) { throw "Installer not found: $exe" }
          if (!(Test-Path $latest)) { throw 'latest.yml missing' }

          $release = gh api "repos/WhiteBelStudio/SxronApp/releases/tags/$tag" | ConvertFrom-Json
          if (!$release.id) { throw "Release not found: $tag" }
          $assetName = Split-Path $exe -Leaf
          $existing = $release.assets | Where-Object { $_.name -eq $assetName -or $_.name -eq 'latest.yml' }
          foreach ($asset in $existing) {
            Write-Host "Removing old asset: $($asset.name) ($($asset.id))"
            gh api --method DELETE "repos/WhiteBelStudio/SxronApp/releases/assets/$($asset.id)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove old asset: $($asset.name)" }
          }

          $env:RELEASE_ID = [string]$release.id
          $env:EXE_PATH = (Resolve-Path $exe).Path
          $env:EXE_NAME = $assetName
          $env:LATEST_PATH = (Resolve-Path $latest).Path
          node build/release-uploader.cjs

      - name: Verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          $expected = "SXRON-Marketplace-Setup-$version-x64.exe"
          if (!($assets.assets.name -contains $expected)) { throw "Published EXE missing: $expected" }
          if (!($assets.assets.name -contains 'latest.yml')) { throw 'Published latest.yml missing' }
          Write-Host 'Release assets verified successfully.'
