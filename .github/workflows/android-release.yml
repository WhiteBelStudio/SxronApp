name: SXRON Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SXRON version: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "SXRON version: $VERSION"

      - name: Build web
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/SXRON-Marketplace-${VERSION}-android.apk"
          ls -lh release

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}"
          APK="release/SXRON-Marketplace-${VERSION}-android.apk"

          test -s "$APK"

          if gh release view "v" >/dev/null 2>&1; then
            echo 'Removing malformed GitHub release tag: v'
            gh release delete "v" --yes --cleanup-tag
          fi

          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SXRON Marketplace ${VERSION}" --notes "SXRON Marketplace ${VERSION}"
          gh release upload "$TAG" "$APK" --clobber

      - name: Verify published APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}"
          EXPECTED="SXRON-Marketplace-${VERSION}-android.apk"
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          grep -Fx "$EXPECTED" <<< "$ASSETS"
