name: SXRON Nightly Health Check

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript and Vite build
        run: npm run build

      - name: Check repository state
        run: |
          echo "SXRON nightly check completed successfully."
          echo "Version: $(node -p \"require('./package.json').version\")"
