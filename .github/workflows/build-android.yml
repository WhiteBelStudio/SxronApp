name: SXRON Android 1.0.1

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.1'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Install Capacitor Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SXRON-Marketplace-1.0.1-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxron-android-1.0.1
          path: SXRON-Marketplace-1.0.1-Android.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          files: SXRON-Marketplace-1.0.1-Android.apk
