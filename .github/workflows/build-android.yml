name: SXRON Android Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v1.0.1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || 'main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Install Capacitor Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Set Android version
        shell: bash
        run: |
          sed -i 's/versionName "1.0"/versionName "1.0.1"/' android/app/build.gradle
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SXRON-Marketplace-1.0.1-Android-debug.apk

      - name: Verify APK
        run: test -s SXRON-Marketplace-1.0.1-Android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxron-android-1.0.1
          path: SXRON-Marketplace-1.0.1-Android-debug.apk

      - name: Upload APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: SXRON-Marketplace-1.0.1-Android-debug.apk
